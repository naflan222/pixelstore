name: Android admin APK
on:
  pull_request:
    paths: ['android/**', 'server/mobile-push.js', '.github/workflows/android-admin.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Prepare signing for a release
        if: ${{ inputs.release }}
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo 'Add the private signing secrets before requesting a release.'; exit 1; fi
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/pixelhouse.jks"
      - name: Tests and APK
        env:
          RELEASE: ${{ inputs.release }}
          ANDROID_KEYSTORE_PATH: ${{ inputs.release && format('{0}/pixelhouse.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ "$RELEASE" = true ]; then
            android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleRelease
          else
            unset ANDROID_KEYSTORE_PATH
            android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pixelhouse-admin-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7
      - name: Remove private files
        if: always()
        run: rm -f "$RUNNER_TEMP/pixelhouse.jks" android/app/google-services.json
