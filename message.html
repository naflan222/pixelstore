<script>

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");



function addUser(msg){

chatBox.innerHTML += `

<div class="user-message-content">

<div class="user-message-text">

<div class="d-block">

<p>${msg}</p>

</div>

</div>

</div>

`;

chatBox.scrollTop = chatBox.scrollHeight;

}




function addBot(msg){

chatBox.innerHTML += `

<div class="agent-message-content d-flex align-items-start">

<div class="agent-thumbnail me-2 mt-2">

<img src="img/bg-img/9.jpg" alt="">

</div>


<div class="agent-message-text">

<div class="d-block">

<p>${msg}</p>

</div>

</div>


</div>

`;

chatBox.scrollTop = chatBox.scrollHeight;

}





async function askGemini(question){


addUser(question);


input.value = "";


addBot("Typing...");



try {


const response = await fetch("/api/chat", {

method: "POST",

headers: {

"Content-Type": "application/json"

},

body: JSON.stringify({

message: question

})

});



const data = await response.json();



document.querySelector(".agent-message-content:last-child").remove();



if(data.reply){

addBot(data.reply);

}
else{

addBot("Sorry, I could not get a response.");

}



}

catch(error){


document.querySelector(".agent-message-content:last-child").remove();


addBot("Connection error. Please try again.");


console.log(error);


}



}





sendBtn.addEventListener("click", function(){


let text = input.value.trim();


if(text !== ""){

askGemini(text);

}


});





input.addEventListener("keypress", function(e){


if(e.key === "Enter"){

e.preventDefault();

sendBtn.click();

}


});


</script>
