name: Storefront and catalog checks
on:
  pull_request:
    paths: ['server/**', 'js/**', 'admin/**', 'catalog/**', 'img/product/**', 'tests/**', 'scripts/**', '*.html', 'service-worker.js', '.github/workflows/storefront-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
